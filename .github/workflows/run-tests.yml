name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.5, 8.4, 8.3]
        stability:
          - prefer-lowest
          - prefer-stable

    name: P${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zlib, pdo_sqlite
          coverage: pcov

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Code style
        if: matrix.stability == 'prefer-stable' && matrix.php == '8.5'
        run: vendor/bin/pint --test

      - name: Static analysis
        if: matrix.stability == 'prefer-stable' && matrix.php == '8.5'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Execute tests
        run: vendor/bin/pest --coverage-clover=coverage.xml --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Installs the package the way a user does (--no-dev, into an empty project) and
  # runs the CLI. On pushes to main it also fetches one country from data.farzai.com.
  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.5, 8.3]

    name: Clean install - P${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zlib, pdo_sqlite
          coverage: none

      - name: Install into an empty project and run
        run: .github/scripts/consumer-smoke.sh ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--live' || '' }}
